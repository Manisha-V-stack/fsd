<!DOCTYPE html>
<html>
<head>
    <title>Edit Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Edit Car</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <input type="text" name="title" class="form-control" value="{{ car.title }}" required>
        </div>

        <div class="mb-3">
            <input type="text" name="brand" class="form-control" value="{{ car.brand }}" required>
        </div>

        <div class="mb-3">
            <input type="number" name="year" class="form-control" value="{{ car.year }}" required>
        </div>

        <div class="mb-3">
            <input type="number" name="price" class="form-control" value="{{ car.price }}" required>
        </div>

        <div class="mb-3">
            <select name="fuel_type" class="form-control" required>
                <option {% if car.fuel_type == "Petrol" %}selected{% endif %}>Petrol</option>
                <option {% if car.fuel_type == "Diesel" %}selected{% endif %}>Diesel</option>
                <option {% if car.fuel_type == "CNG" %}selected{% endif %}>CNG</option>
                <option {% if car.fuel_type == "Electric" %}selected{% endif %}>Electric</option>
                <option {% if car.fuel_type == "Hybrid" %}selected{% endif %}>Hybrid</option>
            </select>
        </div>

        <div class="mb-3">
            <select name="transmission" class="form-control" required>
                <option {% if car.transmission == "Manual" %}selected{% endif %}>Manual</option>
                <option {% if car.transmission == "Automatic" %}selected{% endif %}>Automatic</option>
            </select>
        </div>

        <div class="mb-3">
            <textarea name="description" class="form-control" required>{{ car.description }}</textarea>
        </div>

        <div class="mb-3">
            <input type="file" name="image" class="form-control">
            <small>Leave empty if you don't want to change image</small>
        </div>

        <button type="submit" class="btn btn-primary">Update Car</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
    </form>
</div>

</body>
</html>

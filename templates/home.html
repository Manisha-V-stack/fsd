<!DOCTYPE html>
<html>
<head>
    <title>Car Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand mb-0 h1">🚗 Car Zone</span>
  </div>
</nav>

<div class="container mt-4">
    <div class="row">
        {% for car in cars %}
        <div class="col-md-4">
            <div class="card mb-4">
                <img src="{{ car.image.url }}" class="card-img-top" height="200">
                <div class="card-body">
                    <h5 class="card-title">{{ car.title }}</h5>
                    <p class="card-text">₹ {{ car.price }}</p>
                    <a href="{% url 'car_detail' car.id %}" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>

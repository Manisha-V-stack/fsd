<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>My Cars</h2>
    <a href="/add/" class="btn btn-success mb-3">Add New Car</a>

    <div class="row">
        {% for car in cars %}
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <img src="{{ car.image.url }}" class="card-img-top" height="200" style="object-fit:cover;">
                    <div class="card-body">
                        <h5>{{ car.title }}</h5>
                        <p>₹ {{ car.price }}</p>
                        <a href="/edit/{{ car.id }}/" class="btn btn-warning btn-sm">Edit</a>
                        <a href="/delete/{{ car.id }}/" class="btn btn-danger btn-sm">Delete</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>You have not added any cars yet.</p>
        {% endfor %}
    </div>
</div>

</body>
</html>

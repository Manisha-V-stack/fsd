<!DOCTYPE html>
<html>
<head>
    <title>Add Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Add New Car</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <input type="text" name="title" class="form-control" placeholder="Car Title" required>
        </div>

        <div class="mb-3">
            <input type="text" name="brand" class="form-control" placeholder="Brand" required>
        </div>

        <div class="mb-3">
            <input type="number" name="year" class="form-control" placeholder="Year" required>
        </div>

        <div class="mb-3">
            <input type="number" name="price" class="form-control" placeholder="Price" required>
        </div>

        <div class="mb-3">
            <select name="fuel_type" class="form-control" required>
                <option value="">Select Fuel Type</option>
                <option>Petrol</option>
                <option>Diesel</option>
                <option>CNG</option>
                <option>Electric</option>
                <option>Hybrid</option>
            </select>
        </div>

        <div class="mb-3">
            <select name="transmission" class="form-control" required>
                <option value="">Select Transmission</option>
                <option>Manual</option>
                <option>Automatic</option>
            </select>
        </div>

        <!-- 🔥 SELLER PHONE -->
        <div class="mb-3">
            <input type="text" name="phone" class="form-control" placeholder="Seller Phone Number" required>
        </div>

        <!-- 🔥 SELLER LOCATION -->
        <div class="mb-3">
            <input type="text" name="location" class="form-control" placeholder="Location (City)" required>
        </div>

        <div class="mb-3">
            <textarea name="description" class="form-control" placeholder="Description" required></textarea>
        </div>

        <div class="mb-3">
            <input type="file" name="image" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">Add Car</button>
        <a href="/dashboard/" class="btn btn-secondary">Back</a>
    </form>
</div>

</body>
</html>
